services:
  - type: web
    name: livia
    runtime: node
    plan: free           # disco persistente exige plano pago
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/public
    
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: BASE_URL
        sync: false
